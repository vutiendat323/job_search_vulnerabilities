<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(content=~{::div})">
<div>
    <h2 class="text-2xl font-bold mb-4">Manage Users</h2>
    <table class="table table-hover">
        <thead>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Role</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.username}"></td>
            <td th:text="${user.role}"></td>
            <td>
                <a th:href="@{/admin/users/{id}(id=${user.id})}" class="btn btn-primary btn-sm"><i class="fas fa-eye"></i> View</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</html>
