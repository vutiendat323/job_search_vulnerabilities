<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head('Create Account')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="auth-wrap fade-in">
  <div class="auth-box">

    <div class="auth-header">
      <div class="brand">TopJob</div>
      <h2>Create your account</h2>
      <p>Join thousands of professionals on TopJob</p>
    </div>

    <div class="auth-card">
      <form th:action="@{/register}" method="post">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input id="username" type="text" name="username" class="form-input"
                 placeholder="Choose a username" autocomplete="username" autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input id="password" type="password" name="password" class="form-input"
                 placeholder="Create a password" autocomplete="new-password">
          <p class="form-hint">Must be at least 8 characters.</p>
        </div>

        <button type="submit" class="btn btn-primary btn-w100 mt-8">Create Account</button>
      </form>
    </div>

    <div class="auth-footer">
      Already have an account? <a th:href="@{/login}">Sign in</a>
    </div>
  </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
