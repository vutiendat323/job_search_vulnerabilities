<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head('Admin Dashboard')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="page-header">
  <div class="inner">
    <h1>Admin Dashboard</h1>
    <div class="breadcrumb">
      <a th:href="@{/}">Home</a><span>/</span>Admin
    </div>
  </div>
</div>

<div class="container fade-in">

  <!-- Quick nav -->
  <div class="sec-head mb-16">
    <span class="sec-title">Management</span>
    <div class="sec-line"></div>
  </div>

  <div class="admin-nav-grid">
    <a th:href="@{/admin/users}" class="admin-card">
      <h3>Users</h3>
      <p>View and manage registered accounts.</p>
    </a>
    <a th:href="@{/admin/applications}" class="admin-card">
      <h3>Applications</h3>
      <p>Review submitted applications and uploaded files.</p>
    </a>
    <a th:href="@{/jobs}" class="admin-card">
      <h3>Job Listings</h3>
      <p>Browse all active job postings.</p>
    </a>
    <a th:href="@{/}" class="admin-card" style="border-left-color:var(--muted)">
      <h3 style="color:var(--text2)">Back to Site</h3>
      <p>Return to the public homepage.</p>
    </a>
  </div>

</div>

<footer th:replace="~{layout :: footer}"></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
