<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(content=~{::div})">
<div>
    <h2 class="text-2xl font-bold mb-4">Admin Dashboard</h2>
    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm text-center">
                <div class="card-body">
                    <h5 class="card-title">Manage Users</h5>
                    <p class="card-text">View and manage user accounts.</p>
                    <a href="/admin/users" class="btn btn-primary"><i class="fas fa-users"></i> Go</a>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm text-center">
                <div class="card-body">
                    <h5 class="card-title">Manage Jobs</h5>
                    <p class="card-text">Create and manage job listings.</p>
                    <a href="/jobs" class="btn btn-primary"><i class="fas fa-briefcase"></i> Go</a>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm text-center">
                <div class="card-body">
                    <h5 class="card-title">View Applications</h5>
                    <p class="card-text">Review job applications.</p>
                    <a href="/admin/applications" class="btn btn-primary"><i class="fas fa-file-alt"></i> Go</a>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
