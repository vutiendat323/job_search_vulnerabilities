<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head('Sign In')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="auth-wrap fade-in">
  <div class="auth-box">

    <div class="auth-header">
      <div class="brand">TopJob</div>
      <h2>Welcome back</h2>
      <p>Sign in to access your account</p>
    </div>

    <div class="auth-card">
      <div th:if="${param.error}" class="auth-err">
        Invalid username or password. Please try again.
      </div>

      <form th:action="@{/login}" method="post">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input id="username" type="text" name="username" class="form-input"
                 placeholder="Enter your username" autocomplete="username" autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input id="password" type="password" name="password" class="form-input"
                 placeholder="Enter your password" autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-w100 mt-8">Sign In</button>
      </form>
    </div>

    <div class="auth-footer">
      Don't have an account? <a th:href="@{/register}">Register now</a>
    </div>
  </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
