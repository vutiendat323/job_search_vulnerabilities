<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head('File Viewer')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="page-header">
  <div class="inner">
    <h1>File Viewer</h1>
    <div class="breadcrumb">
      <a th:href="@{/}">Home</a><span>/</span>
      <a th:href="@{/admin/applications}">Applications</a><span>/</span>
      File
    </div>
  </div>
</div>

<div class="container fade-in">

  <div class="card" style="max-width:600px">
    <h3 style="font-size:14px;margin-bottom:16px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px">
      File Path
    </h3>
    <p style="font-family:var(--mono);font-size:14px;color:var(--acc-blue);word-break:break-all;margin-bottom:20px"
       th:text="${filePath}">/uploads/file.pdf</p>
    <a th:href="@{/admin/applications}" class="btn btn-ghost btn-sm">Back to Applications</a>
  </div>

</div>

<footer th:replace="~{layout :: footer}"></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
