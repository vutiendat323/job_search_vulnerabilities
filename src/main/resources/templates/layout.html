<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title} + ' — TopJob'">TopJob</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<nav th:fragment="navbar" class="navbar">
  <a class="nav-brand" th:href="@{/}">TopJob</a>
  <ul class="nav-links">
    <li><a th:href="@{/}">Home</a></li>
    <li><a th:href="@{/jobs}">Browse Jobs</a></li>

    <th:block th:if="${session.user != null and session.user.role == 'ADMIN'}">
      <li><a th:href="@{/admin}" class="nav-admin">Admin</a></li>
    </th:block>

    <th:block th:if="${session.user == null}">
      <li><a th:href="@{/login}">Sign In</a></li>
      <li>
        <a th:href="@{/register}" class="nav-links nav-btn-reg">Register</a>
      </li>
    </th:block>

    <th:block th:if="${session.user != null}">
      <li>
        <span class="nav-user-tag" th:text="${session.user.username}">user</span>
      </li>
      <li><a th:href="@{/logout}">Sign Out</a></li>
    </th:block>
  </ul>
</nav>

<footer th:fragment="footer" class="footer">
  <div class="footer-brand">TopJob</div>
  <p>Connecting talent with opportunity across Vietnam's tech industry.</p>
  <p style="margin-top:10px">
    <a th:href="@{/jobs}">Browse Jobs</a>
    &nbsp;&nbsp;·&nbsp;&nbsp;
    <a th:href="@{/register}">Register</a>
    &nbsp;&nbsp;·&nbsp;&nbsp;
    <a th:href="@{/}">Home</a>
  </p>
  <p style="margin-top:16px;font-size:8px;opacity:.5">&copy; 2024 TopJob. All rights reserved.</p>
</footer>

</html>
