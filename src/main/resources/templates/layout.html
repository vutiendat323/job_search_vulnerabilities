<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-1.10.2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-gray-100">
<nav class="navbar navbar-expand-lg navbar-dark bg-blue-600 shadow-lg">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">JobSearch</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/jobs"><i class="fas fa-briefcase"></i> Jobs</a>
                </li>
                <th:block th:if="${session.user}">
                    <li class="nav-item">
                        <a class="nav-link" href="/logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
                    </li>
                </th:block>
                <th:block th:unless="${session.user}">
                    <li class="nav-item">
                        <a class="nav-link" href="/login"><i class="fas fa-sign-in-alt"></i> Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/register"><i class="fas fa-user-plus"></i> Register</a>
                    </li>
                </th:block>
                <th:block th:if="${session.user?.role == 'ADMIN'}">
                    <li class="nav-item">
                        <a class="nav-link" href="/admin"><i class="fas fa-user-shield"></i> Admin</a>
                    </li>
                </th:block>
            </ul>
        </div>
    </div>
</nav>
<div class="container py-5">
    <th:block th:replace="${content}"/>
</div>
<footer class="bg-blue-600 text-white py-4 mt-5">
    <div class="container text-center">
        <p>© 2025 JobSearch. All rights reserved.</p>
    </div>
</footer>
</body>
</html>
