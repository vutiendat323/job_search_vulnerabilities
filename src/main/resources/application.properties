spring.application.name=JobSearch

# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/jobsearch?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:030203}

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# HikariCP — wait indefinitely for DB to become available (Docker startup ordering)
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=60000

# Thymeleaf Template Settings
spring.thymeleaf.cache=false

# File Upload Settings (Vulnerable - no file type checking)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB